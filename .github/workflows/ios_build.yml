name: Build iOS (ONNX XCFramework + Xcode Project + IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  build-ios:
    name: Build iOS arm64 (macOS + Xcode)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Native ONNX GDExtension XCFramework for iOS
        run: |
          chmod +x tools/build_ios_native.sh
          ./tools/build_ios_native.sh

      - name: Install Godot ${{ env.GODOT_VERSION }} & Export Templates
        run: |
          mkdir -p "$HOME/godot"
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          echo "$HOME/godot/Godot.app/Contents/MacOS" >> $GITHUB_PATH

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$(echo ${GODOT_VERSION} | tr '-' '.')"
          mkdir -p "${TEMPLATE_DIR}"
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates_tmp"
          mv "$HOME/godot/templates_tmp/templates/"* "${TEMPLATE_DIR}/"
          rm -rf "$HOME/godot/templates.tpz" "$HOME/godot/templates_tmp"

      - name: Import Project & Export iOS Xcode Project
        run: |
          mkdir -p build/ios
          Godot --headless --path . --import
          Godot --headless --path . --export-pack "iOS" build/ios/micgame3.pck

      - name: Package Unsigned IPA & Xcode Project Artifacts
        run: |
          # Export full Xcode project wrapper (continues even if no Apple Team ID is set on runner)
          Godot --headless --path . --export-debug "iOS" build/ios/micgame3.ipa || true

          # If Xcode project was generated without code signing credentials, build unsigned .app -> .ipa
          if [ -d "build/ios/micgame3.xcodeproj" ] && [ ! -f "build/ios/micgame3.ipa" ]; then
            xcodebuild -project build/ios/micgame3.xcodeproj \
              -scheme micgame3 \
              -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath build/ios/DerivedData \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build || true

            APP_PATH="$(find build/ios/DerivedData -name '*.app' -type d | head -n 1)"
            if [ -n "${APP_PATH}" ]; then
              mkdir -p build/ios/Payload
              cp -R "${APP_PATH}" build/ios/Payload/
              (cd build/ios && zip -qr micgame3-unsigned.ipa Payload)
              rm -rf build/ios/Payload
            fi
          fi

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-onnx-xcframeworks
          path: |
            addons/onnx_pitch/bin/onnx_pitch.ios.xcframework
            addons/onnx_pitch/bin/onnxruntime.xcframework

      - name: Upload iOS Build & Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-and-ipa
          path: |
            build/ios/
