name: Build iOS (ONNX XCFramework + Xcode Project + IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  build-ios:
    name: Build iOS arm64 (macOS + Xcode)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Native ONNX GDExtension XCFramework for iOS & macOS
        run: |
          chmod +x tools/build_ios_native.sh
          ./tools/build_ios_native.sh

      - name: Install Godot ${{ env.GODOT_VERSION }} & Export Templates
        run: |
          mkdir -p "$HOME/godot"
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          echo "$HOME/godot/Godot.app/Contents/MacOS" >> $GITHUB_PATH

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$(echo ${GODOT_VERSION} | tr '-' '.')"
          mkdir -p "${TEMPLATE_DIR}"
          curl -fSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates_tmp"
          mv "$HOME/godot/templates_tmp/templates/"* "${TEMPLATE_DIR}/"
          rm -rf "$HOME/godot/templates.tpz" "$HOME/godot/templates_tmp"

      - name: Export Godot iOS Xcode Project
        run: |
          mkdir -p build/ios
          Godot --headless --path . --import
          Godot --headless --path . --export-debug "iOS" build/ios/micgame3.ipa
          ls -la build/ios

      - name: Compile Xcode Project & Package Unsigned IPA
        run: |
          if [ ! -d "build/ios/micgame3.xcodeproj" ]; then
            echo "ERROR: build/ios/micgame3.xcodeproj was not generated by Godot export!" >&2
            exit 1
          fi

          xcodebuild -project build/ios/micgame3.xcodeproj \
            -scheme micgame3 \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          APP_PATH="$(find build/ios/DerivedData -name '*.app' -type d | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "ERROR: xcodebuild did not produce a .app bundle!" >&2
            exit 1
          fi

          mkdir -p build/ios/Payload
          cp -R "${APP_PATH}" build/ios/Payload/
          codesign --force --deep --sign - "build/ios/Payload/$(basename "${APP_PATH}")" || true
          (cd build/ios && zip -qr micgame3-unsigned.ipa Payload)
          rm -rf build/ios/Payload build/ios/DerivedData
          ls -lh build/ios/micgame3-unsigned.ipa
          test -s build/ios/micgame3-unsigned.ipa

      - name: Upload iOS Installable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micgame3-ios-ipa
          path: build/ios/micgame3-unsigned.ipa

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micgame3-ios-xcode-project
          path: |
            build/ios/
            !build/ios/micgame3-unsigned.ipa

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-onnx-xcframeworks
          path: |
            addons/onnx_pitch/bin/onnx_pitch.ios.xcframework
            addons/onnx_pitch/bin/libonnx_pitch.macos.dylib
